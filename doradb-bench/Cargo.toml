[package]
name = "doradb-bench"
version = "0.1.0"
edition = "2024"
authors = ["jiangzhe <nju.jiangzhe@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Standalone DoraDB storage benchmark tool"

[[bin]]
name = "doradb-bench"
path = "src/bin/doradb_bench.rs"

[lints]
workspace = true

[features]
default = ["iouring", "profiling"]
iouring = ["doradb-storage/iouring"]
libaio = ["doradb-storage/libaio"]
profiling = ["doradb-storage/profiling"]

[dependencies]
blake3 = { workspace = true }
byte-unit = { workspace = true }
clap = { workspace = true }
doradb-storage = { path = "../doradb-storage", default-features = false }
easy-parallel = { workspace = true }
event-listener = { workspace = true }
hdrhistogram = { workspace = true }
quanta = { workspace = true }
parking_lot = { workspace = true }
rustix = { workspace = true, features = ["param", "time"] }
serde = { workspace = true }
smol = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
