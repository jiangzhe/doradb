name = "recovery-indexed clean reopen"
engine_defaults = "engine-defaults.toml"

[[phase]]
workload = { type = "create-table", index = "unique" }

[[phase]]
workload = { type = "insert-seq", num = 1000000, threads = 4, sessions = 16, value_size = "128 B", batch_size = 100 }

[[phase]]
kind = "benchmark"
warmup_runs = 0
measured_runs = 1
workload = { type = "recovery", include_stats = true }
