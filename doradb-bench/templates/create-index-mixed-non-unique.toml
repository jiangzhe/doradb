engine_defaults = "engine-defaults.toml"

[workload_defaults]
threads = 4
sessions = 16
value_size = "128 B"
batch_size = 100

[[phase]]
workload = { type = "create-table", index = "none" }

[[phase]]
workload = { type = "insert-seq", num = 990000 }

[[phase]]
workload = { type = "freeze-table", all = true }

[[phase]]
workload = { type = "checkpoint-table" }

[[phase]]
workload = { type = "insert-seq", num = 10000 }

[[phase]]
kind = "benchmark"
warmup_runs = 0
measured_runs = 1
workload = { type = "create-index", index = "non-unique", include_stats = true }
